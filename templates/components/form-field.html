{% load ui_tags %}<div class="field{% if field.errors %} field--error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label|ui_text }}{% if field.field.required %}<span aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text|ui_text|safe }}</small>{% endif %}{% for error in field.errors %}<p class="field-error" id="{{ field.id_for_label }}-error">{{ error|ui_text }}</p>{% endfor %}</div>
