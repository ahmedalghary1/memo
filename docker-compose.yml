services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memo_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_PATH=/app/data/db.sqlite3
      - GUNICORN_WORKERS=3
      - GUNICORN_THREADS=2
    volumes:
      - memo_data:/app/data
      - memo_media:/app/media
      - memo_static:/app/staticfiles
    networks:
      - memo_net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M
        reservations:
          cpus: "0.2"
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: memo_nginx
    restart: unless-stopped
    ports:
      # Exposes port 8001 on the host by default.
      # You can change MEMO_PORT in .env (e.g. MEMO_PORT=80 or MEMO_PORT=8080)
      - "${MEMO_PORT:-8001}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - memo_static:/app/staticfiles:ro
      - memo_media:/app/media:ro
    depends_on:
      - web
    networks:
      - memo_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  memo_net:
    name: memo_network
    driver: bridge

volumes:
  memo_data:
    name: memo_db_data
  memo_media:
    name: memo_media_data
  memo_static:
    name: memo_static_data
